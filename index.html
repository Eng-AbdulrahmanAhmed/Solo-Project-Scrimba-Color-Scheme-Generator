<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="options-container">
            <input type="color" id="color-input"/>
           <select name="color-scheme" id="color-scheme-dropdown">
                <option value="monochrome">Monochrome</option>
                <option value="monochrome-dark">Monochrome Dark</option>
                <option value="monochrome-light">Monochrome Light</option>
                <option value="analogic">Analogic</option>
                <option value="complement">Complement</option>
                <option value="analogic-complement">Analogic Complement</option>
                <option value="triad">Triad</option>
                <option value="quad">Quad</option>
           </select>
           <button id="get-scheme-button">Get Color Scheme</button>
        </div>
        <div class="colors-container">
            <div class="color first">
                <span class="color-code">#F55A5A</span>
            </div>
            <div class="color second">
                <span class="color-code">#2B283A</span>
            </div>
            <div class="color third">
                <span class="color-code">#FBF3AB</span>
            </div>
            <div class="color fourth">
                <span class="color-code">#AAD1B6</span>
            </div>
            <div class="color fifth">  
                <span class="color-code">#A626D3</span>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
